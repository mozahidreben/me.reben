      if (window.AndroidBridge) document.documentElement.classList.add('android-app');
      (function () {
        try {
          var own = Object.getOwnPropertyDescriptor(window, 'fetch');
          var proto = !own && window.Window && Window.prototype
            ? Object.getOwnPropertyDescriptor(Window.prototype, 'fetch')
            : null;
          var desc = own || proto;
          if (desc && desc.get && !desc.set && (!own || own.configurable)) {
            var fn = window.fetch.bind(window);
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              writable: true,
              value: fn
            });
          }
        } catch (e) {}
      })();
    </script>
